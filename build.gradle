plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	id 'maven-publish'
	alias(libs.plugins.configuration)
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url "https://jitpack.io"  }
	maven { url "https://maven.awakenedredstone.com"}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"blaze-twitch-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "net.minecraft:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "com.github.twitch4j:twitch4j-fabric:1.25.0+1.11.0"
	implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.18'
	include group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.18'
	modImplementation "io.github.iprodigy.bttv:bttv4j-api:1.0.0"
	include "io.github.iprodigy.bttv:bttv4j-api:1.0.0"
	include "io.github.iprodigy.bttv:bttv4j-common:1.0.0"
	modImplementation 'org.yaml:snakeyaml:2.4'
	include 'org.yaml:snakeyaml:2.4'
	include libs.jspecify
	include "io.github.resilience4j:resilience4j-core:2.3.0"
	include "io.github.resilience4j:resilience4j-ratelimiter:2.3.0"
	include "io.github.resilience4j:resilience4j-circuitbreaker:2.3.0"
	include "io.github.resilience4j:resilience4j-bulkhead:2.3.0"
	include "io.github.resilience4j:resilience4j-timelimiter:2.3.0"
	include "io.github.resilience4j:resilience4j-cache:2.3.0"
	include "io.github.resilience4j:resilience4j-retry:2.3.0"
	include "io.github.resilience4j:resilience4j-feign:2.3.0"

	implementation 'com.github.Chocohead:Fabric-ASM:v2.3'
	include 'com.github.Chocohead:Fabric-ASM:v2.3'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This blocks does NOT have the same function as the blocks in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}